# Pinned CLI 2.121.0; synthetic local migration workspace only.
# Phase 2 must configure and test identity before enabling API/Auth.
# No hosted project is linked. Phase 1 uses compose.yaml for pgTAP.
project_id = "crest-os"

[api]
enabled = false
auto_expose_new_tables = false
schemas = []
extra_search_path = ["extensions"]

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
pool_mode = "session"

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[auth]
enabled = false
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = []
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false
enable_confirmations = true
secure_password_change = true

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[realtime]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = false

[storage]
enabled = false

[storage.s3_protocol]
enabled = false

[storage.analytics]
enabled = false

[storage.vector]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
