name: Quote commercial browser feedback
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/quote-commercial-browser.yml'
      - 'scripts/prepare-ci-ubuntu-apt.sh'
      - 'src/app/quotes/**'
      - 'src/commercial/quote-*'
      - 'src/client/quote-*'
      - 'src/client/quotes.ts'
      - 'src/client/amendment-acceptance-planning.ts'
      - 'src/app/schedule/**'
      - 'tests/integration/quote-amendment-acceptance-product-browser.test.mjs'
      - 'tests/integration/quote-amendment-acceptance-storage.test.mjs'
      - 'tests/integration/quote-amendment53-candidate.test.mjs'
      - 'tests/integration/recovery-drill.test.mjs'
      - 'tests/support/recovery-drill.mjs'
      - 'tests/support/registered52-*.json'
      - 'tests/support/amendment53-export-coverage.json'
      - 'tests/support/quote-amendment53-candidate.mjs'
      - 'planning/SECURITY_EXPORT_COVERAGE.json'
      - 'supabase/migration-checksums.json'
      - 'supabase/migrations/**'
      - 'src/tooling/**'
      - 'scripts/install-recovery-tools.mjs'
      - 'tests/integration/quote-commercial-browser.test.mjs'
      - 'tests/integration/quote-review-browser.test.mjs'
      - 'tests/integration/quote-browser-response.test.mjs'
      - 'tests/support/quote-browser-response.mjs'
      - 'tests/support/source-export-browser-fixture.mjs'
permissions:
  contents: read
concurrency:
  group: quote-commercial-browser-feedback-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser_feedback:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [commercial, amendment, amendment_integrity]
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      CREST_ENV: test
      CREST_TEST_DATABASE_URL: postgresql://supabase_admin:crest_local_test_only@127.0.0.1:54322/crest_test
    services:
      postgres:
        image: supabase/postgres:17.11.0.006@sha256:c141fd17ac6a76c4323e90b3aee8ff1a23d2e89e547c2b963cfadc309c079cc2
        env:
          POSTGRES_USER: supabase_admin
          POSTGRES_PASSWORD: crest_local_test_only
          POSTGRES_DB: crest_test
        ports:
          - 127.0.0.1:54322:5432
        options: >-
          --health-cmd "pg_isready -U supabase_admin -d crest_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - run: node scripts/install-tools.mjs
      - name: Install browser dependencies with bounded Ubuntu downloads
        if: matrix.suite != 'amendment_integrity'
        timeout-minutes: 6
        run: |
          bash scripts/prepare-ci-ubuntu-apt.sh
          npx --no-install playwright install --with-deps chromium webkit
      - if: matrix.suite != 'amendment_integrity'
        run: npm run build
      # Fast, genuine Auth/PostgreSQL/actual Next feedback. This does not replace
      # any mandatory full release/security/recovery/container gate in ci.yml.
      - if: matrix.suite == 'commercial'
        run: node --test --test-concurrency=1 tests/integration/quote-browser-response.test.mjs tests/integration/quote-commercial-browser.test.mjs tests/integration/quote-review-browser.test.mjs
      - if: matrix.suite == 'amendment'
        run: node --conditions=react-server --test --test-concurrency=1 tests/integration/quote-amendment-acceptance-product-browser.test.mjs
      # Legacy/current profile refusal and independent recovery need early
      # feedback too. These same suites remain mandatory in the full release.
      - if: matrix.suite == 'amendment_integrity'
        run: |
          node scripts/install-recovery-tools.mjs
          node --conditions=react-server --test --test-concurrency=1 tests/integration/quote-amendment-acceptance-storage.test.mjs tests/integration/quote-amendment53-candidate.test.mjs tests/integration/recovery-drill.test.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && matrix.suite != 'amendment_integrity'
        with:
          name: commercial-browser-feedback-${{ matrix.suite }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .local/review/quote-commercial-*.png
            .local/review/amendment-acceptance-*.png
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: warn
