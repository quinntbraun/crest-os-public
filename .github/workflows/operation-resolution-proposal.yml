name: Original operation resolution proposal

on:
  push:
    branches: [feature/original-operation-resolution]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proposal:
    name: Isolated operation resolution proposal
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "true"
      CREST_ENV: test
      CREST_TEST_DATABASE_URL: postgresql://supabase_admin:crest_local_test_only@127.0.0.1:54322/crest_test
      VERIFY_BASE_REF: 940b9133dc3cfcf7904c1501ce20b2ca824add98
    services:
      postgres:
        image: supabase/postgres:17.11.0.006@sha256:c141fd17ac6a76c4323e90b3aee8ff1a23d2e89e547c2b963cfadc309c079cc2
        env:
          POSTGRES_USER: supabase_admin
          POSTGRES_PASSWORD: crest_local_test_only
          POSTGRES_DB: crest_test
        ports:
          - 127.0.0.1:54322:5432
        options: >-
          --health-cmd "pg_isready -U supabase_admin -d crest_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Verify runtime and install exact lockfile
        run: |
          test "$(node --version)" = "v24.22.0"
          test "$(npm --version)" = "11.19.1"
          npm ci --ignore-scripts --no-fund
      - name: Verify source and immutable registered history
        run: |
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
          git show -s --format=%P HEAD
          npm run verify:public
          npm run verify:canonical
          npm run verify:migrations
          npm run verify:dependencies
          npm run typecheck
          npm run lint
          npx --no-install vitest run tests/unit/original-operation-reference.test.ts
      - name: Install verified database tooling
        run: node scripts/install-tools.mjs
      - name: Prove isolated proposal claims, authorization and competing devices
        run: npm run test:operation-resolution-proposal-db
