name: Synthetic lead state proposal

on:
  push:
    branches: [feature/lead-lifecycle]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lead-lifecycle-proposal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proposal:
    name: Isolated lead state proposal
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      CREST_ENV: test
      CREST_TEST_DATABASE_URL: postgresql://supabase_admin:crest_local_test_only@127.0.0.1:54322/crest_test
    services:
      postgres:
        image: supabase/postgres:17.11.0.006@sha256:c141fd17ac6a76c4323e90b3aee8ff1a23d2e89e547c2b963cfadc309c079cc2
        env:
          POSTGRES_USER: supabase_admin
          POSTGRES_PASSWORD: crest_local_test_only
          POSTGRES_DB: crest_test
        ports:
          - 127.0.0.1:54322:5432
        options: >-
          --health-cmd "pg_isready -U supabase_admin -d crest_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Verify runtime and exact dependency lock
        run: |
          test "$(node --version)" = "v24.22.0"
          test "$(npm --version)" = "11.19.1"
          npm ci --ignore-scripts --no-fund
      - name: Install verified database tooling
        run: node scripts/install-tools.mjs
      - name: Preserve current canonical source and check proposal code
        run: |
          npm run verify:public
          npm run verify:canonical
          npm run verify:migrations
          npm run verify:dependencies
          .local/tools/gitleaks/gitleaks dir . --redact --no-banner
          npm run lint
          npm run typecheck
          npm test -- tests/unit/lead-state-contract.test.ts tests/unit/lead-event-csv.test.ts
      - name: Exercise actual isolated PostgreSQL proposal
        run: node --test --test-concurrency=1 tests/integration/lead-state-proposal.test.mjs
      - name: Install pinned recovery tooling
        run: node scripts/install-recovery-tools.mjs
      - name: Restore encrypted same-snapshot lead state proposal
        run: node --test --test-concurrency=1 tests/integration/lead-state-recovery-proposal.test.mjs
