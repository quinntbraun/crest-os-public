name: Phase 1 verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Each group owns a separate cluster; fixtures create global roles and
  # must remain serial inside that cluster. No suite is removed or optional.
  database_foundation:
    name: Database foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      CREST_ENV: test
      CREST_TEST_DATABASE_URL: postgresql://supabase_admin:crest_local_test_only@127.0.0.1:54322/crest_test
    services:
      postgres:
        image: supabase/postgres:17.11.0.006@sha256:c141fd17ac6a76c4323e90b3aee8ff1a23d2e89e547c2b963cfadc309c079cc2
        env:
          POSTGRES_USER: supabase_admin
          POSTGRES_PASSWORD: crest_local_test_only
          POSTGRES_DB: crest_test
        ports:
          - 127.0.0.1:54322:5432
        options: >-
          --health-cmd "pg_isready -U supabase_admin -d crest_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Verify runtime and install exact lockfile
        run: |
          test "$(node --version)" = "v24.22.0"
          test "$(npm --version)" = "11.19.1"
          npm ci --ignore-scripts --no-fund
      - name: Install verified database tooling
        run: node scripts/install-tools.mjs
      - name: Run isolated regression group
        run: |
          npm run test:db
          npm run test:migrations
          npm run test:security-db
          npm run test:identity-db
          npm run test:sessions-db
          npm run test:provider-db
          npm run test:session-commands-db
          npm run test:login-admission-db
          npm run test:tenant-read-db
          npm run test:mutation-fence-db
          npm run test:operation-storage-db
          npm run test:operation-lookup-db
          npm run test:business-name-db
          npm run test:business-settings-db
          npm run test:customers-db
          npm run test:addresses-db
          npm run test:vehicles-db
          npm run test:associations-db
          npm run test:leads-db
          npm run test:lead-state-db
          npm run test:lead-vehicles-db
          npm run test:lead-addresses-db
      - name: Install pinned recovery tooling
        run: node scripts/install-recovery-tools.mjs
      - name: Prove unregistered atomic conversion, source export and encrypted recovery
        run: node --test --test-concurrency=1 tests/integration/lead-conversion.test.mjs
      - name: Encrypted isolated database recovery drill
        run: npm run test:recovery-db

  database_provider:
    name: Provider and evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      CREST_ENV: test
      CREST_TEST_DATABASE_URL: postgresql://supabase_admin:crest_local_test_only@127.0.0.1:54322/crest_test
    services:
      postgres:
        image: supabase/postgres:17.11.0.006@sha256:c141fd17ac6a76c4323e90b3aee8ff1a23d2e89e547c2b963cfadc309c079cc2
        env:
          POSTGRES_USER: supabase_admin
          POSTGRES_PASSWORD: crest_local_test_only
          POSTGRES_DB: crest_test
        ports:
          - 127.0.0.1:54322:5432
        options: >-
          --health-cmd "pg_isready -U supabase_admin -d crest_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Verify runtime and install exact lockfile
        run: |
          test "$(node --version)" = "v24.22.0"
          test "$(npm --version)" = "11.19.1"
          npm ci --ignore-scripts --no-fund
      - name: Install verified database tooling
        run: node scripts/install-tools.mjs
      - name: Run isolated regression group
        run: |
          npm run test:provider-cleanup-db
          npm run test:provider-inventory-db
          npm run test:provider-evidence-db
          npm run test:provider-attempts-db
          npm run test:provider-targets-db
          npm run test:login-fences-db
          npm run test:provider-requests-db
          npm run test:provider-executor-db
          npm run test:provider-review-db
          npm run test:provider-export-db

  authentication:
    name: Genuine authentication
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      CREST_ENV: test
      CREST_TEST_DATABASE_URL: postgresql://supabase_admin:crest_local_test_only@127.0.0.1:54322/crest_test
    services:
      postgres:
        image: supabase/postgres:17.11.0.006@sha256:c141fd17ac6a76c4323e90b3aee8ff1a23d2e89e547c2b963cfadc309c079cc2
        env:
          POSTGRES_USER: supabase_admin
          POSTGRES_PASSWORD: crest_local_test_only
          POSTGRES_DB: crest_test
        ports:
          - 127.0.0.1:54322:5432
        options: >-
          --health-cmd "pg_isready -U supabase_admin -d crest_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Verify runtime and install exact lockfile
        run: |
          test "$(node --version)" = "v24.22.0"
          test "$(npm --version)" = "11.19.1"
          npm ci --ignore-scripts --no-fund
      - name: Install verified database tooling
        run: node scripts/install-tools.mjs
      - name: Run isolated regression group
        run: |
          npm run test:real-auth

  foundation:
    name: Foundation checks
    needs: [database_foundation, database_provider, authentication]
    # Run even when a prerequisite fails/skips so branch protection cannot see
    # a skipped required job as success. The guard rejects incomplete results.
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      CREST_ENV: test
      CREST_TEST_DATABASE_URL: postgresql://supabase_admin:crest_local_test_only@127.0.0.1:54322/crest_test
    services:
      postgres:
        image: supabase/postgres:17.11.0.006@sha256:c141fd17ac6a76c4323e90b3aee8ff1a23d2e89e547c2b963cfadc309c079cc2
        env:
          POSTGRES_USER: supabase_admin
          POSTGRES_PASSWORD: crest_local_test_only
          POSTGRES_DB: crest_test
        ports:
          - 127.0.0.1:54322:5432
        options: >-
          --health-cmd "pg_isready -U supabase_admin -d crest_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Verify runtime and install exact lockfile
        run: |
          test "$(node --version)" = "v24.22.0"
          test "$(npm --version)" = "11.19.1"
          npm ci --ignore-scripts --no-fund
      - name: Require every prerequisite to succeed
        env:
          CREST_CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/verify-ci-results.mjs
      - name: Verify immutable tooling and scan secrets
        run: |
          node scripts/install-tools.mjs
          .local/tools/gitleaks/gitleaks git --redact --log-opts="--all"
          .local/tools/gitleaks/gitleaks dir . --redact
      - name: Verify canonical provenance and append-only migrations
        env:
          VERIFY_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          npm run verify:public
          npm run verify:canonical
          if [ "$VERIFY_BASE_REF" = "0000000000000000000000000000000000000000" ]; then unset VERIFY_BASE_REF; fi
          npm run verify:migrations
          npm run verify:dependencies
      - name: Dependency security gate
        run: npm run audit:dependencies
      - name: Install checksum-pinned PDF inspector
        run: |
          test -f /etc/apt/apt-mirrors.txt
          grep -qF 'mirror+file:/etc/apt/apt-mirrors.txt' /etc/apt/sources.list.d/ubuntu.sources
          printf '%s\tpriority:1\n%s\tpriority:2\n' 'https://archive.ubuntu.com/ubuntu/' 'https://security.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          printf '%s\n' 'Acquire::Retries "2";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99crest-ci-downloads > /dev/null
          # Source-build dependencies only; never copied into the runtime image.
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install --yes --no-install-recommends cmake g++ make pkg-config libjpeg-dev zlib1g-dev
          node scripts/install-pdf-tools.mjs
      - name: Build checksum-pinned HEIC decoder and separate synthetic encoder
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install --yes --no-install-recommends libpng-dev libx265-dev
          node scripts/install-heic-tools.mjs --fixtures
      - name: Lint, types and regression tests
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run test:private-files
          npm run test:image-validation
          npm run test:pdf-validation
          npm run test:heic-validation
      - name: Install browser dependencies with bounded Ubuntu downloads
        timeout-minutes: 6
        run: |
          npx --no-install playwright install --with-deps chromium webkit
      - name: Production build and browser accessibility smoke
        run: |
          npm run build
          npm run test:e2e
          npm run test:sign-in-browser
      - name: Build and smoke-test portable container
        run: |
          docker build --tag crest-os:ci .
          docker run --detach --name crest-os-smoke --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges --publish 127.0.0.1:3100:3000 crest-os:ci
          node scripts/smoke-container.mjs
          test "$(docker inspect --format '{{.Config.User}}' crest-os-smoke)" = "node"
          npm run test:image-sandbox
          npm run test:pdf-sandbox
          npm run test:heic-sandbox
          npm run test:file-intake
          node scripts/install-recovery-tools.mjs
          npm run test:object-recovery
          export CREST_IMAGE_ID="$(docker image inspect --format '{{.Id}}' crest-os:ci)"
          npm run release:manifest
          docker save crest-os:ci -o .local/release/crest-os-image.tar
          sha256sum .local/release/crest-os-image.tar > .local/release/crest-os-image.tar.sha256
      - name: Container diagnostics
        if: failure()
        run: docker logs crest-os-smoke || true
      - name: Stop smoke container
        if: always()
        run: docker rm -f crest-os-smoke || true
      - name: Preserve candidate artifact and provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phase-1-candidate-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: .local/release/
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error
      - name: Preserve synthetic settings screenshots
        # Successful synthetic UI screenshots contain no credentials or real data.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: settings-review-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: .local/review/settings-*.png
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error
      - name: Preserve browser diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-diagnostics-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 3
          if-no-files-found: ignore
